name: Publish to PyPI

# Publishes the package to PyPI whenever a version tag (e.g. v2.2.0) is pushed.
# Uses PyPI Trusted Publishing (OIDC) — no API token or secret is stored here.
# One-time setup on PyPI: add a "pending publisher" for this repo/workflow.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
